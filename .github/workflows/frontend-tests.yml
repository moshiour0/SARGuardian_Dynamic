name: Frontend build, lint and tests
# Includes inline Google Maps dashboard rendering in the Processing workspace.

on:
  pull_request:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches: [main, feat/in-app-interactive-dashboard, fix/manual-aoi-target-fallback-20261027, fix/google-dashboard-in-frontend-20261028]
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-tests.yml"

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
