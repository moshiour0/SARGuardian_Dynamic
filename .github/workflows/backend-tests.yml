name: Backend tests
# Includes verified Google Maps adapter/key-contract tests for dashboard HTML.

on:
  pull_request:
    branches: [main]
    paths:
      - "Backend/**"
      - "docs/DISPLACEMENT_ACTIONS.md"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/sarguardian-aoi-wkt-dashboard.yml"
  push:
    branches:
      - main
      - fix/supabase-github-migrations
      - fix/manual-aoi-target-fallback-20261027
      - fix/google-dashboard-in-frontend-20261028
    paths:
      - "Backend/**"
      - "docs/DISPLACEMENT_ACTIONS.md"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/sarguardian-aoi-wkt-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-test.txt

      - name: Install backend test dependencies
        run: python -m pip install -r Backend/requirements-test.txt

      - name: Validate canonical Supabase migration layout
        shell: bash
        run: |
          set -euo pipefail
          test -f Backend/supabase/config.toml
          test -f Backend/supabase/migrations/20261017143644_processing_jobs.sql
          test -f Backend/supabase/migrations/20261022203034_displacement_jobs.sql
          test -f Backend/supabase/migrations/20261023141449_displacement_active_request_guard.sql
          test -f Backend/supabase/migrations/20261024111404_scientific_request_contract.sql
          test -f Backend/supabase/migrations/20261027003643_place_target_contract.sql
          test ! -e Backend/migrations/001_processing_jobs.sql
          test ! -e Backend/migrations/002_displacement_jobs.sql
          test ! -e Backend/migrations/003_displacement_active_request_guard.sql
          test ! -e Backend/migrations/004_scientific_request_contract.sql
          test ! -e Backend/migrations/005_place_target_contract.sql
          if git grep -n -F -e '001_processing_jobs.sql' -e '002_displacement_jobs.sql' -e '003_displacement_active_request_guard.sql' -e '004_scientific_request_contract.sql' -- . ':!.github/workflows/backend-tests.yml'; then
            echo "Stale legacy migration filename reference found."
            exit 1
          fi

      - name: Validate the pinned science dashboard workflow
        shell: bash
        env:
          EXPECTED_DASHBOARD_BUILDER_SHA: 53037524016717a3cc42f6a41789c7c0c9de235d
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/sarguardian-aoi-wkt-dashboard.yml"); puts "SCIENCE_DASHBOARD_WORKFLOW_YAML_PASS"'
          count="$(grep -F -o "$EXPECTED_DASHBOARD_BUILDER_SHA" .github/workflows/sarguardian-aoi-wkt-dashboard.yml | wc -l | tr -d ' ')"
          test "$count" = "2" || { echo "ERROR=EXPECTED_EXACTLY_TWO_VERIFIED_DASHBOARD_PIN_REFERENCES actual=$count"; exit 1; }
          echo "PINNED_BUILDER_REVISION_CONTRACT=PASS"
          echo "SCIENCE_DASHBOARD_BUILDER_PIN_PASS=$EXPECTED_DASHBOARD_BUILDER_SHA"

      - name: Run backend test suite
        working-directory: Backend
        run: python -m pytest -q
